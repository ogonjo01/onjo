[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[dev]
  functions = "netlify/functions"
  command = "npm run dev"
  port = 8081         # Netlify proxy
  targetPort = 8082   # Actual Vite server (based on your logs)


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


  [[redirects]]
  from = "/summary/*"
  to = "/review/:splat"
  status = 301
  force = true