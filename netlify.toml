# ── ONJO Reviews netlify.toml ──────────────────────────────────────────────
[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[dev]
  functions = "netlify/functions"
  command = "npm run dev"
  port = 8081
  targetPort = 8082

# review-adviser MUST come before /* or the catch-all swallows it
[[redirects]]
  from = "/api/review-adviser"
  to = "/.netlify/functions/review-adviser"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/summary/*"
  to = "/review/:splat"
  status = 301
  force = true