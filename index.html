<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Title -->
    <title>ONJO Reviews — Product evaluation and recommendation platform</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="We review, compare, and break down products to help people make better buying decisions."
    />

    <!-- Author -->
    <meta name="author" content="ONJO Reviews" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Ads -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7769353221684341"
      crossorigin="anonymous"
    ></script>

    <!-- Site Verifications -->
    <meta name="fo-verify" content="21a310c3-d17e-4f2f-a3c9-3cb8f1f2d16f" />
    <meta
      name="impact-site-verification"
      content="bdd2f6b2-fab1-4439-a5be-262e70f28c25"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="ONJO Reviews — A product review and recommendation platform" />
    <meta
      property="og:description"
      content="Find expert reviews and ratings for tech products, software, AI tools, and gadgets. Make smarter buying decisions with ONJO Reviews."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://dreamy-choux-ec7a29.netlify.app/onjo-reviews-banner.jpg"
    />
    <meta property="og:url" content="https://your-onjo-app.netlify.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ONJO Reviews — A product review and recommendation platform" />
    <meta
      name="twitter:description"
      content="Expert, unbiased tech product reviews and recommendations. ONJO Reviews helps you choose the best gadgets, software, and AI tools."
    />
    <meta
      name="twitter:image"
      content="https://dreamy-choux-ec7a29.netlify.app/onjo-reviews-banner.jpg"
    />
    <meta name="twitter:site" content="@ogonjo_" />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="product reviews, tech reviews, software reviews, AI tools, gadgets, honest reviews, product recommendations, buying guide"
    />

    <!-- Base Reset Styles -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background-color: var(--theme-color-background, #f8f9fa);
        font-family: 'Montserrat', sans-serif;
        width: 100%;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        width: 100%;
        margin: 0;
        overflow-x: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
